<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title></title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, sans-serif; color: #222; background: #fafafa; }
  main { text-align: center; padding: 1rem; }
  p { margin: .25rem 0; color: #555; }
</style>
</head>
<body>
<main>
  <div id="opening">
    <p lang="uz">Havola ochilmoqda…</p>
    <p lang="ru">Ссылка открывается…</p>
    <p lang="en">Opening link…</p>
  </div>
  <div id="expired" hidden>
    <p lang="uz">Havola eskirgan</p>
    <p lang="ru">Ссылка устарела</p>
    <p lang="en">Link expired</p>
  </div>
  <noscript>
    <p lang="uz">JavaScript kerak</p>
    <p lang="ru">Требуется JavaScript</p>
    <p lang="en">JavaScript is required</p>
  </noscript>
</main>
<script>
// This page does not contain the address the link leads to. The script asks
// the server for it with a POST request. Programs that only preview links
// do not send that request, so they can neither use up the link nor see
// where it goes.
fetch(location.pathname, {method: "POST"})
  .then(function (response) { return response.ok ? response.json() : Promise.reject(); })
  .then(function (data) { location.replace(data.url); })
  .catch(function () {
    document.getElementById("opening").hidden = true;
    document.getElementById("expired").hidden = false;
  });
</script>
</body>
</html>
